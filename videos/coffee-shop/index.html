<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Reasons to Open a Coffee Shop</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Anton";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("vendor/anton.woff2") format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }

      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* The photo layer. Every scene keeps the author's image untouched —
         cover for the portrait shots, contain over a blurred copy of itself
         for the landscape ones so nothing that matters gets cropped away. */
      .stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #000;
      }

      .photo {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        object-position: center;
      }

      .backdrop {
        position: absolute;
        inset: -80px;
        width: 1240px;
        height: 2080px;
        object-fit: cover;
        filter: blur(48px) saturate(1.15) brightness(0.55);
      }

      /* The P&L is a landscape document: it rides in its own panel so the zoom
         and the highlight share one coordinate space and stay glued together. */
      .sheetzoom {
        position: absolute;
        left: 0;
        top: 600px;
        width: 1080px;
        height: 723px;
        /* The final number — the fixed point the push-in converges on. */
        transform-origin: 91.25% 95.2%;
      }

      .sheet {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Sits over the "-$16,360.72" cell, in sheet-relative units, so it tracks
         the number through the zoom. */
      .hl {
        position: absolute;
        left: 84.2%;
        top: 92.1%;
        width: 15%;
        height: 5.8%;
        border: 4px solid #ffd166;
        border-radius: 8px;
        background: rgba(255, 209, 102, 0.18);
        box-shadow:
          0 0 0 5px rgba(255, 209, 102, 0.16),
          0 0 26px rgba(255, 209, 102, 0.55);
      }

      /* Legibility scrim: dark at the top where the copy sits, dark again at
         the very bottom so the TikTok UI has something to sit on. */
      .scrim-strong {
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.8) 30%,
          rgba(0, 0, 0, 0.34) 46%,
          rgba(0, 0, 0, 0.24) 78%,
          rgba(0, 0, 0, 0.62) 100%
        );
      }

      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.74) 0%,
          rgba(0, 0, 0, 0.52) 26%,
          rgba(0, 0, 0, 0.12) 48%,
          rgba(0, 0, 0, 0.18) 78%,
          rgba(0, 0, 0, 0.6) 100%
        );
      }

      /* Caption safe area: 8% side margins, copy in the upper third, and the
         bottom 15% / right 12% left clear for TikTok's own chrome. */
      .cap {
        position: absolute;
        left: 86px;
        top: 300px;
        width: 908px;
        font-family: "Anton", "Liberation Sans", sans-serif;
        font-size: 96px;
        line-height: 1.06;
        letter-spacing: -0.005em;
        color: #ffffff;
        text-shadow:
          0 4px 22px rgba(0, 0, 0, 0.92),
          0 2px 6px rgba(0, 0, 0, 0.85);
      }

      .cap-hook {
        font-size: 128px;
        line-height: 1.02;
      }

      .cap-payoff {
        font-size: 104px;
      }

      /* The number carries the joke, so it gets the accent. */
      .tag {
        display: block;
        font-size: 0.52em;
        letter-spacing: 0.06em;
        color: #ffd166;
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13.5"
      data-width="1080"
      data-height="1920"
    >
      <!-- Scene 1 — hook. Cropped in on him so he fills the frame. -->
      <section id="s1" class="clip" data-start="0" data-duration="2" data-track-index="1">
        <div class="stage">
          <img id="s1-img" class="photo" data-layout-allow-overflow src="assets/01-lease-space.jpg" alt="" />
        </div>
        <div class="scrim"></div>
        <div id="s1-cap" class="cap cap-hook">Reasons to Open a Coffee Shop</div>
      </section>

      <!-- Scene 2 — the P&L. Contained so the numbers stay readable. -->
      <section id="s2" class="clip" data-start="2" data-duration="2.5" data-track-index="1">
        <div class="stage">
          <img id="s2-bg" class="backdrop" data-layout-allow-overflow src="assets/02-costs.png" alt="" />
          <div id="s2-zoom" class="sheetzoom" data-layout-allow-overflow>
            <img id="s2-img" class="sheet" data-layout-allow-overflow src="assets/02-costs.png" alt="" />
            <div id="s2-hl" class="hl"></div>
          </div>
        </div>
        <div class="scrim scrim-strong"></div>
        <div id="s2-cap" class="cap">
          <span class="tag">Reason #1</span>Lose 20K in 2 Month
        </div>
      </section>

      <!-- Scene 3 — pre-dawn skyline. -->
      <section id="s3" class="clip" data-start="4.5" data-duration="2.5" data-track-index="1">
        <div class="stage">
          <img id="s3-img" class="photo" data-layout-allow-overflow src="assets/03-5am.jpg" alt="" />
        </div>
        <div class="scrim"></div>
        <div id="s3-cap" class="cap">
          <span class="tag">Reason #2</span>Wake Up at 5AM
        </div>
      </section>

      <!-- Scene 4 — bare studs on site. -->
      <section id="s4" class="clip" data-start="7" data-duration="2.5" data-track-index="1">
        <div class="stage">
          <img id="s4-img" class="photo" data-layout-allow-overflow src="assets/04-construction.jpg" alt="" />
        </div>
        <div class="scrim"></div>
        <div id="s4-cap" class="cap">
          <span class="tag">Reason #3</span>Doing Construction at 98 Degree
        </div>
      </section>

      <!-- Scene 5 — the payoff the beat drops on. -->
      <section id="s5" class="clip" data-start="9.5" data-duration="4" data-track-index="1">
        <div class="stage">
          <img id="s5-img" class="photo" data-layout-allow-overflow src="assets/05-paddling.jpg" alt="" />
        </div>
        <div class="scrim"></div>
        <div id="s5-cap" class="cap cap-payoff">
          <span class="tag">Reason #4</span>Enjoy Paddling Whenever You Want
        </div>
      </section>
    </div>

    <script>
      // Scene table drives both the camera move and the caption entrance so the
      // timing here stays in step with the data-start/data-duration above.
      // `target` is what the move is applied to: the photo itself, except on the
      // P&L where it is the panel holding the sheet *and* its highlight, so the
      // two zoom together as one object.
      const SCENES = [
        {
          id: "s1",
          start: 0,
          duration: 2,
          target: "#s1-img",
          from: { scale: 1.05 },
          to: { scale: 1.16 },
        },
        {
          id: "s2",
          start: 2,
          duration: 2.5,
          target: "#s2-zoom",
          // Starts on the whole sheet, then pushes in and drifts left so the
          // final number ends up left of the TikTok UI rail rather than under it.
          from: { scale: 1.0, x: 0, y: 0 },
          to: { scale: 1.95, x: -325, y: 54 },
          ease: "power2.inOut",
        },
        {
          id: "s3",
          start: 4.5,
          duration: 2.5,
          target: "#s3-img",
          from: { scale: 1.08 },
          to: { scale: 1.0 },
        },
        {
          id: "s4",
          start: 7,
          duration: 2.5,
          target: "#s4-img",
          from: { scale: 1.0 },
          to: { scale: 1.09 },
        },
        {
          id: "s5",
          start: 9.5,
          duration: 4,
          target: "#s5-img",
          from: { scale: 1.0 },
          to: { scale: 1.12 },
        },
      ];

      function buildTimeline() {
        const tl = gsap.timeline({ paused: true });

        SCENES.forEach((scene) => {
          // fromTo keeps the start state in the tween, never in CSS, so the two
          // can never disagree.
          tl.fromTo(
            scene.target,
            scene.from,
            Object.assign({}, scene.to, {
              duration: scene.duration,
              ease: scene.ease || "none",
            }),
            scene.start,
          );

          // Caption lands just after the cut.
          tl.fromTo(
            "#" + scene.id + "-cap",
            { y: 30, autoAlpha: 0 },
            { y: 0, autoAlpha: 1, duration: 0.3, ease: "power3.out" },
            scene.start + 0.05,
          );
        });

        // The blurred backdrop behind the sheet drifts the other way so the
        // panel does not feel locked to the frame.
        tl.fromTo(
          "#s2-bg",
          { scale: 1.04 },
          { scale: 1.0, duration: 2.5, ease: "none" },
          2,
        );

        // The highlight snaps onto the final number once the push-in is most of
        // the way there, so the eye arrives with the camera.
        tl.fromTo(
          "#s2-hl",
          { scale: 1.35, autoAlpha: 0 },
          { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2.6)" },
          3.15,
        );

        // The drop lands on scene 5: one firm punch on the payoff copy.
        tl.fromTo(
          "#s5-cap",
          { scale: 0.94 },
          { scale: 1, duration: 0.42, ease: "back.out(2.2)" },
          9.55,
        );

        window.__timelines["main"] = tl;
      }

      // Anton is a local woff2, but register only once it is actually laid out
      // so the first frames are never measured against the fallback face.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(buildTimeline);
      } else {
        buildTimeline();
      }
    </script>
  </body>
</html>
